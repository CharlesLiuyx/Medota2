name: verify

on:
  pull_request:
  push:
    branches: [main, "codex/publish/**"]
  workflow_dispatch:
    inputs:
      profile:
        description: Reproducible diagnostic scope (never promotion evidence)
        type: choice
        default: auto
        options: [auto, full, items, hero-build, map]

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base: ${{ steps.plan.outputs.base }}
      file: ${{ steps.plan.outputs.file }}
      browserShards: ${{ steps.plan.outputs.browserShards }}
      browserShardCount: ${{ steps.plan.outputs.browserShardCount }}
      promoted: ${{ steps.plan.outputs.promoted }}
      core: ${{ steps.plan.outputs.core }}
      coreLanes: ${{ steps.plan.outputs.coreLanes }}
      browser: ${{ steps.plan.outputs.browser }}
      coreDatabase: ${{ steps.plan.outputs.coreDatabase }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan affected checks and verify promotion evidence
        id: plan
        env:
          BENCHMARK_PROFILE: ${{ inputs.profile }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/development/ci-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: medota2-plan-${{ github.run_id }}
          path: .medota2/check-plan.json
          retention-days: 14

  core:
    needs: plan
    if: needs.plan.outputs.core == 'true'
    name: core (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.coreLanes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Restore pnpm policy and registry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-policy-${{ runner.os }}-${{ runner.arch }}-11.7.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/verify.yml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore verified check results
        if: matrix.lane == 'static'
        uses: actions/cache@v4
        with:
          path: .medota2/check-cache
          key: checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'scripts/development/**') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'scripts/development/**') }}-

      - name: Run selected core lane
        env:
          CHECK_BASE: ${{ needs.plan.outputs.base }}
          CHECK_FILE: ${{ needs.plan.outputs.file }}
          CHECK_LANE: ${{ matrix.lane }}
        run: |
          if [ -n "$CHECK_FILE" ]; then
            pnpm check --files "$CHECK_FILE" --lane "$CHECK_LANE"
          else
            pnpm check --base "$CHECK_BASE" --lane "$CHECK_LANE"
          fi
      - name: Release this job's reusable test database
        if: always() && matrix.lane == 'runtime' && needs.plan.outputs.coreDatabase == 'true'
        run: pnpm test:clean
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medota2-verification-${{ github.run_id }}-core-${{ matrix.lane }}
          path: |
            .medota2/check-plan.json
            .medota2/checks/*/run.json
            .medota2/checks/*/phases.jsonl
            .medota2/checks/*/*.log
            .medota2/shared-tests/runs/**/*.log
            .medota2/shared-tests/runs/**/run.json
            .medota2/shared-tests/runs/**/report
            .medota2/shared-tests/runs/**/test-results
            .medota2/shared-tests/runs/**/playwright/report
            .medota2/shared-tests/runs/**/playwright/test-results
            .medota2/benchmarks/runs
            .medota2/releases/*/manifest.json
            .medota2/test-runs/*/run.json
            .medota2/test-runs/*/index.md
            .medota2/test-runs/*/logs
            .medota2/test-runs/*/artifacts
          if-no-files-found: warn
          retention-days: 14

  browser:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browserShards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Restore pnpm policy and registry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-policy-${{ runner.os }}-${{ runner.arch }}-11.7.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/verify.yml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run browser shard with one worker on its own host and database
        env:
          CHECK_BASE: ${{ needs.plan.outputs.base }}
          CHECK_FILE: ${{ needs.plan.outputs.file }}
          CHECK_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.browserShardCount }}
        run: |
          if [ -n "$CHECK_FILE" ]; then
            pnpm check --files "$CHECK_FILE" --lane browser --shard "$CHECK_SHARD"
          else
            pnpm check --base "$CHECK_BASE" --lane browser --shard "$CHECK_SHARD"
          fi
      - name: Release this job's reusable test database
        if: always()
        run: pnpm test:clean
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medota2-verification-${{ github.run_id }}-browser-${{ matrix.shard }}
          path: |
            .medota2/check-plan.json
            .medota2/checks/*/run.json
            .medota2/checks/*/phases.jsonl
            .medota2/checks/*/browser-shards.json
            .medota2/checks/*/*.test-list.txt
            .medota2/checks/*/*.timings.json
            .medota2/checks/*/*.log
            .medota2/shared-tests/runs/**/*.log
            .medota2/shared-tests/runs/**/run.json
            .medota2/shared-tests/runs/**/report
            .medota2/shared-tests/runs/**/test-results
            .medota2/shared-tests/runs/**/playwright/report
            .medota2/shared-tests/runs/**/playwright/test-results
            .medota2/benchmarks/runs
            .medota2/releases/*/manifest.json
            .medota2/test-runs/*/run.json
            .medota2/test-runs/*/index.md
            .medota2/test-runs/*/logs
            .medota2/test-runs/*/artifacts
          if-no-files-found: warn
          retention-days: 14

  verify:
    needs: [plan, core, browser]
    # Same-SHA promotion was fully checked in plan; no empty second job on main.
    # Failed planning and direct pushes still require the aggregate gate.
    if: always() && needs.plan.outputs.promoted != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected gate or verified same-commit promotion
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CORE_REQUIRED: ${{ needs.plan.outputs.core }}
          BROWSER_REQUIRED: ${{ needs.plan.outputs.browser }}
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$CORE_REQUIRED" = true ]; then test "$CORE_RESULT" = success; else test "$CORE_RESULT" = skipped; fi
          if [ "$BROWSER_REQUIRED" = true ]; then test "$BROWSER_RESULT" = success; else test "$BROWSER_RESULT" = skipped; fi
