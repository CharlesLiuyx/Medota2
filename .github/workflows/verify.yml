name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the repository verification interface
        run: pnpm verify

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medota2-verification-${{ github.run_id }}
          path: |
            .medota2/test-runs/*/run.json
            .medota2/test-runs/*/index.md
            .medota2/test-runs/*/logs
            .medota2/test-runs/*/artifacts
          if-no-files-found: warn
          retention-days: 14
